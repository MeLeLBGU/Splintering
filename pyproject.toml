[project]
name = "splintering"
version = "1.0.0"
requires-python = ">= 3.10"

authors = [
    {name = "Bar Gazit",         email = "bargazi@post.bgu.ac.il"},
    {name = "Shaltiel Shmidman", email = "shaltieltzion@gmail.com"},
    {name = "Avi Shmidman",      email = "avi.shmidman@biu.ac.il"},
    {name = "Yuval Pinter",      email = "uvp@cs.bgu.ac.il"},
]
description = "Splinter is a text pre-processing step which rearranges characters into a linear form that better represents nonconcatenative morphologies, enabling meaningful contiguous segments to be found by a subword tokenizer."
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
readme = "README.md"

dependencies = [
    "numpy < 2.0.0",
    "scipy",
    "scikit-learn",
    "pandas",
    "nltk",
    "tqdm",
    "sentencepiece",
    "datasets",
    "tokenization-scorer ~= 1.1.6",
    "openpyxl ~= 3.1.5",
]

[project.urls]
Source = "https://github.com/MeLeLBGU/Splintering"
Issues = "https://github.com/MeLeLBGU/Splintering/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splintering"]
